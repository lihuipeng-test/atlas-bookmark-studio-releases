name: 问题反馈
description: 搜索条件、保存、备份或界面问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请不要填写 API Key、密码、Cookie，也不要上传整份私人书签备份。"
  - type: input
    id: version
    attributes:
      label: 浏览器和扩展版本
      placeholder: "Chrome 版本；扩展 0.20.11"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 使用环境
      options:
        - 国服 POE1
        - 国际服 POE1
        - 国服 POE2
        - 国际服 POE2
        - 安装或设置页面
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与原始购买描述
      description: 简述从哪一步开始，输入了什么，怎样出现问题。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果、实际结果和错误提示
      description: 可以附上不包含个人信息的截图或搜索链接。
    validations:
      required: true
